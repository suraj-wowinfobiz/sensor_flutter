name: Deploy Flutter Web to Windows VM (IIS)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_PORT: 12856
      IIS_SITE_NAME: SensorWeb
      IIS_SITE_PORT: 8097
      IIS_SITE_ROOT: C:\Users\Administrator\Desktop\sensor_web\website

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Create env file
      run: |
        mkdir -p assets
        echo "API_BASE_URL=http://103.211.202.145:8091/user-auth-service" > assets/.env

    - name: Build Flutter Web
      run: flutter build web --release

    - name: Prepare deploy files
      run: |
        TMP_DIR=$GITHUB_WORKSPACE/deploy-files
        mkdir -p $TMP_DIR

        # Keep hidden files too (if present)
        cp -R build/web/. "$TMP_DIR/"

        # Ensure IIS serves Flutter static assets correctly
        cat > "$TMP_DIR/web.config" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration>
          <system.webServer>
            <defaultDocument>
              <files>
                <clear />
                <add value="index.html" />
              </files>
            </defaultDocument>
            <staticContent>
              <mimeMap fileExtension=".wasm" mimeType="application/wasm" />
              <mimeMap fileExtension=".json" mimeType="application/json" />
              <mimeMap fileExtension=".webp" mimeType="image/webp" />
            </staticContent>
          </system.webServer>
        </configuration>
        EOF

        chmod -R 755 $TMP_DIR
        ls -la $TMP_DIR

    - name: Cleanup and prepare target directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: ${{ env.VM_PORT }}
        script_stop: true
        script: |
          powershell -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; $root = '${{ env.IIS_SITE_ROOT }}'; New-Item -ItemType Directory -Path $root -Force | Out-Null; Remove-Item -Path ($root + '\*') -Recurse -Force -ErrorAction SilentlyContinue"

    - name: Copy files to Windows VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: ${{ env.VM_PORT }}
        source: "deploy-files/*"
        target: "C:/Users/Administrator/Desktop/sensor_web/website"
        strip_components: 1

    - name: Configure IIS and verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: ${{ env.VM_PORT }}
        script_stop: true
        script: |
          powershell -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; Import-Module WebAdministration; $siteName='${{ env.IIS_SITE_NAME }}'; $port=${{ env.IIS_SITE_PORT }}; $root='${{ env.IIS_SITE_ROOT }}'; if (-not (Test-Path $root)) { throw 'Site root does not exist: ' + $root }; if (Get-WebSite -Name $siteName -ErrorAction SilentlyContinue) { Remove-WebSite -Name $siteName }; New-WebSite -Name $siteName -Port $port -PhysicalPath $root -Force | Out-Null; Set-ItemProperty ('IIS:\Sites\' + $siteName) -Name applicationPool -Value 'DefaultAppPool'; Start-WebSite -Name $siteName"
          netsh advfirewall firewall delete rule name="${{ env.IIS_SITE_NAME }} Port ${{ env.IIS_SITE_PORT }}" protocol=TCP localport=${{ env.IIS_SITE_PORT }} || echo Firewall rule did not exist
          netsh advfirewall firewall add rule name="${{ env.IIS_SITE_NAME }} Port ${{ env.IIS_SITE_PORT }}" dir=in action=allow protocol=TCP localport=${{ env.IIS_SITE_PORT }}
          icacls "C:\Users\Administrator\Desktop\sensor_web\website" /grant IIS_IUSRS:(OI)(CI)RX /T
          dir "C:\Users\Administrator\Desktop\sensor_web\website"
          echo Site is running on http://103.211.202.145:${{ env.IIS_SITE_PORT }}
