name: Deploy Frontend Docker Image to Linux Server

on:
  push:
    branches:
      - main
      - v2-monolithic
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/sensor-frontend' }}
      IMAGE_NAME: sensor-frontend
      CONTAINER_NAME: sensor-frontend
      HOST_PORT: 8096
      CONTAINER_PORT: 80
      IMAGE_TAR_NAME: sensor-frontend.tar
      REMOTE_DOCKER: ${{ secrets.REMOTE_DOCKER || 'docker' }}
      ADMIN_API_BASE_URL: ${{ secrets.ADMIN_API_BASE_URL || 'http://103.211.202.145:8097' }}
      USER_API_BASE_URL: ${{ secrets.USER_API_BASE_URL || 'http://103.211.202.145:8097' }}
      USER_ADMIN_API_BASE_URL: ${{ secrets.USER_ADMIN_API_BASE_URL || 'http://103.211.202.145:8097' }}
      ENGINEER_API_BASE_URL: ${{ secrets.ENGINEER_API_BASE_URL || 'http://103.211.202.145:8097' }}
      VENDOR_API_BASE_URL: ${{ secrets.VENDOR_API_BASE_URL || 'http://103.211.202.145:8097' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install sshpass
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Build frontend docker image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --build-arg ADMIN_API_BASE_URL="$ADMIN_API_BASE_URL" \
            --build-arg USER_API_BASE_URL="$USER_API_BASE_URL" \
            --build-arg USER_ADMIN_API_BASE_URL="$USER_ADMIN_API_BASE_URL" \
            --build-arg ENGINEER_API_BASE_URL="$ENGINEER_API_BASE_URL" \
            --build-arg VENDOR_API_BASE_URL="$VENDOR_API_BASE_URL" \
            -t "$IMAGE_REF" .

      - name: Save frontend image archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          docker save "$IMAGE_REF" -o "release/${IMAGE_TAR_NAME}"

      - name: Trust remote host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 20 -p "$SSH_PORT" -H "$SSH_HOST" 2>&1 | tee /tmp/frontend-ssh-keyscan.log >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure remote frontend directory exists
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Stop existing frontend container
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e; if $REMOTE_DOCKER ps -a --format '{{.Names}}' | grep -qx '$CONTAINER_NAME'; then $REMOTE_DOCKER stop '$CONTAINER_NAME' >/dev/null 2>&1 || true; $REMOTE_DOCKER rm '$CONTAINER_NAME' >/dev/null 2>&1 || true; fi"

      - name: Free frontend host port
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e; PORT_CONTAINERS=\$($REMOTE_DOCKER ps -a --filter \"publish=$HOST_PORT\" --format '{{.Names}}'); for c in \$PORT_CONTAINERS; do if [ \"\$c\" != '$CONTAINER_NAME' ]; then $REMOTE_DOCKER stop \"\$c\" >/dev/null 2>&1 || true; $REMOTE_DOCKER rm \"\$c\" >/dev/null 2>&1 || true; fi; done"

      - name: Upload frontend image
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e rsync -az -e "ssh -p $SSH_PORT" "release/${IMAGE_TAR_NAME}" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/${IMAGE_TAR_NAME}"

      - name: Load new frontend image and prune old tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e; cd '$DEPLOY_PATH'; $REMOTE_DOCKER load -i '$IMAGE_TAR_NAME'; rm -f '$IMAGE_TAR_NAME'; for img in \$($REMOTE_DOCKER images '$IMAGE_NAME' --format '{{.Repository}}:{{.Tag}}' | grep -vFx '$IMAGE_REF' || true); do $REMOTE_DOCKER rmi -f \"\$img\" >/dev/null 2>&1 || true; done"

      - name: Run frontend container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e; cd '$DEPLOY_PATH'; $REMOTE_DOCKER run -d --name '$CONTAINER_NAME' --restart unless-stopped -p '$HOST_PORT:$CONTAINER_PORT' '$IMAGE_REF'"
